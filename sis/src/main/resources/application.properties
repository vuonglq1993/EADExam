spring.datasource.url=jdbc:mysql://localhost:8889/sis?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate 7 no longer provides org.hibernate.dialect.MySQL8Dialect.
# Let Hibernate auto-detect, or use the generic MySQL dialect if you want to pin it:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql after Hibernate creates/updates schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always