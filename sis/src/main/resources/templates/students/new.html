<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body})}">
<body>
<div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Add Student</h3>
        <a class="btn btn-outline-secondary" th:href="@{/scores}">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/students}" th:object="${studentForm}" method="post" class="row g-3">
                <div class="col-12 col-lg-4">
                    <label class="form-label">Student Code</label>
                    <input class="form-control" th:field="*{studentCode}" maxlength="20" required/>
                </div>

                <div class="col-12 col-lg-8">
                    <label class="form-label">Full Name</label>
                    <input class="form-control" th:field="*{fullName}" maxlength="100" required/>
                </div>

                <div class="col-12">
                    <label class="form-label">Address</label>
                    <input class="form-control" th:field="*{address}" maxlength="255"/>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/scores}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
