<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'SIS'">SIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/scores}">SIS</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/scores}">Scores</a>
            <a class="nav-link" th:href="@{/students/new}">+ Student</a>
            <a class="nav-link" th:href="@{/scores/new}">+ Score</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${toast}" class="alert alert-success shadow-sm" th:text="${toast}"></div>
    <div th:replace="${content}"></div>
</main>
</body>
</html>
