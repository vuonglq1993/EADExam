<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body})}">
<body>
<div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Add Score</h3>
        <a class="btn btn-outline-secondary" th:href="@{/scores}">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/scores}" th:object="${scoreForm}" method="post" class="row g-3">
                <div class="col-12 col-lg-6">
                    <label class="form-label">Student</label>
                    <select class="form-select" th:field="*{studentId}" required>
                        <option value="" selected disabled>-- Choose student --</option>
                        <option th:each="s : ${students}"
                                th:value="${s.studentId}"
                                th:text="${s.studentCode + ' - ' + s.fullName}">
                            2007A10 - Nguyễn Văn A
                        </option>
                    </select>
                </div>

                <div class="col-12 col-lg-6">
                    <label class="form-label">Subject</label>
                    <select class="form-select" th:field="*{subjectId}" required>
                        <option value="" selected disabled>-- Choose subject --</option>
                        <option th:each="su : ${subjects}"
                                th:value="${su.subjectId}"
                                th:text="${su.subjectCode + ' - ' + su.subjectName}">
                            JAVA - Java Programming
                        </option>
                    </select>
                </div>

                <div class="col-12 col-lg-6">
                    <label class="form-label">Score 1</label>
                    <input type="number" step="0.01" min="0" max="10" class="form-control" th:field="*{score1}" required/>
                </div>

                <div class="col-12 col-lg-6">
                    <label class="form-label">Score 2</label>
                    <input type="number" step="0.01" min="0" max="10" class="form-control" th:field="*{score2}" required/>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/scores}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
